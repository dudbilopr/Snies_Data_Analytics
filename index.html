<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ecosistema de Análisis - Ciencia de Datos (SNIES)</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    
    <!-- Sidebar Navigation -->
    <nav class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <i class="fa-solid fa-chart-line"></i>
                <span>CDAT Analytics</span>
            </div>
        </div>
        <ul class="nav-links">
            <li class="active" data-view="dashboard">
                <a href="#"><i class="fa-solid fa-border-all"></i> Panorama General</a>
            </li>
            <li data-view="estudiantes">
                <a href="#"><i class="fa-solid fa-user-graduate"></i> Estudiantes</a>
            </li>
            <li data-view="docentes">
                <a href="#"><i class="fa-solid fa-chalkboard-user"></i> Docentes & Admin</a>
            </li>
            <li data-view="mercado">
                <a href="#"><i class="fa-solid fa-money-check-dollar"></i> Precios y Mercado</a>
            </li>
            <li data-view="glosario">
                <a href="#"><i class="fa-solid fa-book"></i> Glosario SNIES</a>
            </li>
        </ul>
        <div class="sidebar-footer">
            <p>SNIES Data Engine</p>
        </div>
    </nav>

    <!-- Main Content Area -->
    <main class="main-content">
        <header class="topbar">
            <div class="title-area">
                <h1 id="page-title">Panorama General</h1>
                <p id="page-subtitle">Análisis del estado de la Ciencia de Datos en Colombia</p>
            </div>
            <div class="actions">
                <button class="btn-primary" id="refresh-data"><i class="fa-solid fa-rotate-right"></i> Recargar</button>
            </div>
        </header>

        <!-- View Container -->
        <div id="app-container" class="view-container">
            <!-- Loading State -->
            <div id="loader" class="loader-container">
                <div class="spinner"></div>
                <p>Cargando millones de registros SNIES...</p>
            </div>
        </div>
    </main>

    <!-- Libraries -->
    <script type="module" src="./main.js"></script>
</body>
</html>
